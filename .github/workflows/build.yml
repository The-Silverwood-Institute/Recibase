name: Test Code + Build Docker Image
on:
  push:
    branches:
      - 'master'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - name: Setup SBT
      uses: sbt/setup-sbt@v1
    - name: scalafmtCheckAll
      run: sbt scalafmtCheckAll
    - name: Test
      run: sbt test
    - name: Build
      run: sbt "Docker / publishLocal"
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Docker Tag
      run: docker tag recibase:latest ghcr.io/the-silverwood-institute/recibase:latest
    - name: Docker Push
      run: docker push ghcr.io/the-silverwood-institute/recibase:latest
    - name: Trigger Coolify Deployment
      env:
        COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
      run: |
        curl -fsS -X POST \
          -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
          -- "${COOLIFY_DEPLOY_WEBHOOK}"
